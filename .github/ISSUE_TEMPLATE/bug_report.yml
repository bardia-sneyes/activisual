name: Bug report
description: Report reproducible incorrect behavior in Activisual
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Activisual. Please remove secrets and private trace data before submitting.
  - type: input
    id: version
    attributes:
      label: Activisual version
      description: Run `npx activisual --version` or provide the installed package version.
      placeholder: 0.1.2
    validations:
      required: true
  - type: dropdown
    id: harness
    attributes:
      label: Harness
      options:
        - Codex
        - Claude Code
        - Pi
        - OpenCode
        - Hermes Agent
        - Multiple or not applicable
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js version, and any other relevant runtime details.
      placeholder: Windows 11, Node.js 22
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide a minimal, repeatable sequence of steps.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste only sanitized logs or trace excerpts. This field is rendered as code.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed secrets, credentials, private prompts, and sensitive trace data.
          required: true
