name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: node scripts/check-release-version.js "${GITHUB_REF_NAME}"
      - run: npm run verify
      - run: npm pack
      # npm authenticates this workflow through its trusted publisher and
      # automatically records provenance for this public repository.
      - run: npm publish
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" activisual-*.tgz --verify-tag --generate-notes --title "Activisual ${GITHUB_REF_NAME}"
