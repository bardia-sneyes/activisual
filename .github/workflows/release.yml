name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: node scripts/check-release-version.js "${GITHUB_REF_NAME}"
      - run: npm run verify
      - run: npm pack
      # npm provenance currently requires a public GitHub source repository.
      - run: npm publish --provenance=false
        env:
          # Used for the first release; npm prefers OIDC after trusted publishing is configured.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" activisual-*.tgz --verify-tag --generate-notes --title "Activisual ${GITHUB_REF_NAME}"
